services:

  backend:
    build:
      context: ./backend
    container_name: carpinteria_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "3001"
    networks:
      - carpinteria_network

  frontend:
    build:
      context: ./frontend
    container_name: carpinteria_frontend
    restart: unless-stopped
    ports:
      - "8085:80"
    depends_on:
      - backend
    networks:
      - carpinteria_network

networks:
  carpinteria_network:
    driver: bridge